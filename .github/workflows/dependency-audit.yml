name: Dependency audit

on:
  push:
    paths:
      - 'cicte-lab-monitor/package.json'
      - 'cicte-lab-monitor/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'cicte-lab-monitor/package.json'
      - 'cicte-lab-monitor/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicte-lab-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cicte-lab-monitor/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
